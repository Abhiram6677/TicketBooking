{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Create your account</h1>
        <form method="post" novalidate>{% csrf_token %}
          {% include "accounts/_form_fields.html" %}
          <button class="btn btn-brand w-100">Sign up</button>
        </form>
        <p class="mt-3 mb-0 small text-center">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
